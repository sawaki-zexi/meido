name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web
      - run: npm run build:landing -- --base /meido/

  chat-e2e:
    name: Windows chat E2E
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: New-Item -ItemType Directory -Force -Path .data/chat-e2e | Out-Null
      - run: python -m pytest tests/python/test_meido_server_runner.py -q --basetemp=.data/chat-e2e/runner
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-chat-e2e
          include-hidden-files: true
          path: |
            .data/chat-e2e/artifacts/**
            .data/chat-e2e/runner/**/runner.log
            .data/chat-e2e/runner/**/launcher.log

  backend:
    name: Backend tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            args: >-
              tests/python/test_api.py::test_role_api_crud_and_duplicate_names
              tests/python/test_api.py::test_role_has_one_persistent_session_and_streams_completed_reply
              tests/python/test_api.py::test_role_update_preserves_session_messages_and_changes_future_prompt
              tests/python/test_api.py::test_delete_role_removes_role_session_messages_and_files
              tests/python/test_model_config.py
              tests/python/test_agent_runtime.py::test_agent_loop_runs_tool_then_final_provider_turn
              tests/python/test_role_store.py
              tests/python/test_role_prompt_compiler.py
              tests/python/test_role_card_import.py
              tests/python/test_role_card_export.py
              tests/python/test_todo_plugin.py::test_role_reminder_generation_uses_personality_facts_and_read_only_related_memory
              tests/python/test_api.py::test_role_creation_uses_canonical_binding_and_never_persists_legacy_credentials
              tests/python/test_api.py::test_role_creation_rejects_missing_canonical_connection_without_writing_role
              tests/python/test_api.py::test_role_validation_errors_do_not_echo_credentials
              tests/python/test_api.py::test_in_use_model_connection_cannot_be_deleted_until_role_rebinds
              tests/python/test_api.py::test_unresolved_legacy_binding_blocks_send_and_can_be_explicitly_reselected
              tests/python/test_api.py::test_legacy_resolved_role_uses_canonical_snapshot_without_exposing_credentials
              tests/python/test_api.py::test_binding_commit_serializes_with_connection_deletion
              tests/python/test_api.py::test_role_creation_and_scene_policy_edit_share_one_lock_order
              tests/python/test_api.py::test_role_model_configuration_api_persists_and_only_changes_selected_role
              tests/python/test_api.py::test_role_model_configuration_api_rejects_missing_configuration_without_changing_binding
              tests/python/test_api.py::test_role_model_configuration_api_failure_keeps_previous_binding
              tests/python/test_api.py::test_role_messages_use_bound_configuration_and_reject_deleted_binding
              tests/python/test_api.py::test_role_message_keeps_configuration_snapshot_when_binding_changes_during_stream
              tests/python/test_api.py::test_unbound_role_uses_active_model_configuration
              tests/python/test_api.py::test_role_message_snapshot_does_not_persist_legacy_role_secrets
              tests/python/test_computer_use.py::test_unresolved_role_binding_never_uses_global_connection_or_starts_driver
          - group: channels
            args: >-
              tests/python/channels/test_adapters.py::test_napcat_group_event_is_normalized_for_host_listener_policy
              tests/python/channels/test_adapters.py::test_napcat_group_member_target_uses_private_message_shape
              tests/python/channels/test_runtime_delivery.py::test_real_channel_runtime_commits_reply_only_after_confirmed_delivery
              tests/python/channels/test_natural_turn.py::test_natural_model_receives_host_verified_sender_identity
          - group: drift
            args: tests/python/test_drift_meme_api.py::test_owner_can_explicitly_enable_builtin_meme_maintenance_without_shell
          - group: chat-lifecycle
            args: >-
              tests/python/test_chat_lifecycle.py
              tests/python/test_chat_stream_projection.py
              tests/python/test_chat_stop.py
              tests/python/test_natural_reply_api.py
              tests/python/test_natural_runtime.py
              tests/python/test_tool_progress.py
              tests/python/test_tool_audit_diagnostics.py
              tests/python/test_chat_runtime_http.py
              tests/python/test_chat_presentation.py
              tests/python/test_chat_snapshot_io.py
              tests/python/test_chat_server_shutdown.py
              tests/python/test_meido_server_runner.py
              tests/python/test_api.py::test_completed_reply_does_not_depend_on_consuming_the_http_response
              tests/python/test_api.py::test_unsubscribed_message_is_completed_and_role_can_send_again
          - group: context-preparation
            args: >-
              tests/python/test_memory_review_regressions.py
              tests/python/test_context_memory_parity.py
              tests/python/test_host_memory_optimizer.py
              tests/python/test_memory_runtime_parity.py
              tests/python/test_embeddings.py
              tests/python/test_memory_write_tools.py
              tests/python/test_memory_tools_api.py
              tests/python/test_memory_tool.py
              tests/python/test_memory_optimizer.py
              tests/python/test_proactive_context.py::test_tick_freezes_context_then_next_tick_reads_new_version_without_granting_tools
              tests/python/test_memory_engine.py
              tests/python/test_memory.py
              tests/python/channels/test_owner_memory_progress.py
              tests/python/channels/test_consolidation_parity.py
              tests/python/test_context_preparation.py
              tests/python/test_stream_preparation.py
              tests/python/test_owner_history_view.py
              tests/python/test_context_inspection.py
              tests/python/test_context_windows.py
              tests/python/test_current_tool_registry.py
              tests/python/test_tool_namespace_context.py
              tests/python/test_tool_exposure_contract.py
              tests/python/channels/test_group_owner_identity.py
              tests/python/test_role_capabilities.py
              tests/python/test_input_usage_calibration.py
              tests/python/test_batched_summary.py
              tests/python/test_summary_accounting.py
              tests/python/test_output_usage.py
              tests/python/test_compaction_diagnostics.py
              tests/python/test_tool_discovery.py
              tests/python/test_tool_search_budgets.py
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest ${{ matrix.args }} -o faulthandler_timeout=90 --durations=5
