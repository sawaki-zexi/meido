name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Isolate push and PR runs; newer commits still cancel obsolete runs per event.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select checks
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" | python .github/scripts/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test:web

  backend:
    name: Backend tests (${{ matrix.group }})
    needs: changes
    # A skipped matrix job never expands its check names. Keep all required
    # checks present and skip only the expensive steps for unrelated changes.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [core, channels, drift]
    steps:
      - name: Select backend steps
        id: scope
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
        run: |
          if [[ "$CHANGES_RESULT" == "success" && "$BACKEND_CHANGED" == "false" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend changes; this backend check is complete without running tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Verify CI workflow contract
        if: steps.scope.outputs.run == 'true' && matrix.group == 'core'
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m unittest discover -s .github/tests -v

      - name: Compile Python sources
        if: steps.scope.outputs.run == 'true'
        run: python -m compileall -q backend tests

      - name: Run tests
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p test-results
          case "${{ matrix.group }}" in
            channels)
              python -m pytest tests/python/channels -o faulthandler_timeout=90 --durations=15 \
                --junitxml="test-results/${{ matrix.group }}.xml"
              ;;
            drift)
              python -m pytest tests/python/test_drift_meme_api.py -o faulthandler_timeout=90 --durations=15 \
                --junitxml="test-results/${{ matrix.group }}.xml"
              ;;
            core)
              mapfile -t backend_tests < <(find tests/python -maxdepth 1 -type f -name 'test_*.py' \
                ! -name 'test_drift_meme_api.py' -print | sort)
              python -m pytest "${backend_tests[@]}" -o faulthandler_timeout=90 --durations=15 \
                --junitxml="test-results/${{ matrix.group }}.xml"
              ;;
          esac

      - name: Upload backend test report
        if: ${{ always() && steps.scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.group }}
          path: test-results/${{ matrix.group }}.xml
          if-no-files-found: ignore
