name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:web
      - run: npm run build:landing -- --base /meido/

  backend:
    name: Backend tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            args: >-
              tests/python/test_api.py::test_role_api_crud_and_duplicate_names
              tests/python/test_api.py::test_role_has_one_persistent_session_and_streams_completed_reply
              tests/python/test_api.py::test_role_update_preserves_session_messages_and_changes_future_prompt
              tests/python/test_api.py::test_delete_role_removes_role_session_messages_and_files
              tests/python/test_model_config.py::test_provider_presets_and_saved_configuration_are_publicly_masked
              tests/python/test_agent_runtime.py::test_agent_loop_runs_tool_then_final_provider_turn
              tests/python/test_role_store.py::test_role_store_persists_json_and_role_directories
          - group: channels
            args: >-
              tests/python/channels/test_adapters.py::test_napcat_group_event_is_normalized_for_host_listener_policy
              tests/python/channels/test_adapters.py::test_napcat_group_member_target_uses_private_message_shape
              tests/python/channels/test_runtime_delivery.py::test_real_channel_runtime_commits_reply_only_after_confirmed_delivery
          - group: drift
            args: tests/python/test_drift_meme_api.py::test_owner_can_explicitly_enable_builtin_meme_maintenance_without_shell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest ${{ matrix.args }} -o faulthandler_timeout=90 --durations=5
